  - id: bureaux_etudes-relance-devis-missions
    status: produit
    last_touch_date: "2026-08-10"
    prospects: []
    notes: "Pack vente + build complets. 3 entreprises ICP identifiées via recherche web (sites institutionnels, Pappers, annuaire-entreprises.data.gouv.fr) dans gtm.md, aucun contact LinkedIn nominatif sourcé à date. Prochain run: sourcing prospect avant passage à ready_to_pitch. Cas NON fragile (paybacks pessimistes ≈15,7 mois, sous le seuil de 20 mois). Point d'attention: prix retenu (12 500 €) représente 61% du gain brut annuel estimé, au-dessus du plafond de 40% recommandé par le skill proposition-commerciale-vantyse — à corriger via ce skill avant tout envoi réel à un prospect (cf. 03-pilotage/pricing-internal.md)."
  - id: imprimeries-extraction-devis-entrants
    status: produit
    last_touch_date: "2026-08-11"
    prospects: []
    notes: "Pack vente + build complets (incl. proposition-commerciale.docx généré via skill docx). 3 entreprises ICP identifiées via recherche web (société.com, Pappers) dans gtm.md, aucun contact LinkedIn nominatif sourcé à date. Prochain run: sourcing prospect avant passage à ready_to_pitch. Cas FRAGILE (paybacks pessimistes 20,0-25,7 mois, au-dessus du seuil de 20 mois) — ne pas pitcher au prix plein (12 000 €) sans validation du volume réel hebdomadaire de devis du prospect ; envisager l'option MVP (4 200 €) si le volume est incertain. Premier cas produit dans le secteur imprimeries (usage_count 0→1)."
  - id: cabinets_geometres-qualification-routage-demandes-entrantes
    status: produit
    last_touch_date: "2026-08-12"
    prospects: []
    notes: "Pack vente + build complets (incl. proposition-commerciale.docx généré via skill docx, validité structurelle confirmée — vérification visuelle via LibreOffice headless impossible dans cet environnement, cf. CLAUDE.md). 3 entreprises ICP identifiées via recherche web (société.com, verif.com, site institutionnel geoval.geometre-expert.fr) dans gtm.md, aucun contact LinkedIn nominatif sourcé à date. Prochain run: sourcing prospect avant passage à ready_to_pitch. Cas FRAGILE (paybacks pessimistes 26,0 mois dans les deux scénarios, au-dessus du seuil de 20 mois) — recommandation explicite dans risks.md de privilégier l'option MVP (2 600 €) pour les cabinets de moins de 10 salariés (ex: Cabinet Arthur, Bordeaux, 6-9 salariés) avant d'engager le prix plein (7 500 €). Premier cas produit dans le secteur cabinets_geometres (usage_count 0→1). Prix fixé sous le plancher habituel de la grille automatisation_ia (12 000€) pour rester réaliste vis-à-vis de la taille moyenne des cabinets ciblés, même logique que le cas garages_independants du 2026-08-09."
  - id: societes_nettoyage-traitement-rapports-intervention
    status: produit
    last_touch_date: "2026-08-13"
    prospects: []
    notes: "Pack vente + build complets (incl. proposition-commerciale.docx généré via skill docx npm, installé localement puis retiré du dossier livré ; validité structurelle confirmée via file/unzip -t). 3 entreprises ICP identifiées via recherche web (annuaire-entreprises.data.gouv.fr, sites institutionnels) dans gtm.md, aucun contact LinkedIn nominatif sourcé à date. Prochain run: sourcing prospect avant passage à ready_to_pitch. Cas FRAGILE (paybacks pessimistes 26,5-29,5 mois, largement au-dessus du seuil de 20 mois) — de plus, le prix retenu (6 500 €) représente ~108% du gain brut annuel estimé (6 010 €), au-dessus du plafond de 40% recommandé par le skill proposition-commerciale-vantyse (cf. 03-pilotage/pricing-internal.md) : ne pas envoyer tel quel à un prospect réel, repasser par le skill avec les données réelles du client ou privilégier l'option MVP (2 300 €). Premier cas produit dans le secteur societes_nettoyage (usage_count 0→1)."
